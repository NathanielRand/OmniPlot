<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="OmniPlot — Professional web-based PPF &amp; window tint cutting software. Works with any plotter, any device."
		/>
		<meta name="theme-color" content="#080A0F" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
		<script>
			(function () {
				const stored = localStorage.getItem("omniplot-theme");
				const preferred =
					stored ||
					(window.matchMedia("(prefers-color-scheme: dark)").matches
						? "dark"
						: "light");
				document.documentElement.setAttribute("data-theme", preferred);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="svelte">%sveltekit.body%</div>
	</body>
</html>
